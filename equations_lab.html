<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NCERT Class 10: Chemical Equation Lab</title>
    <style>
        :root {
            --sidebar-w: 360px;
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --accent: #3b82f6;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* --- Left Sidebar --- */
        #sidebar {
            width: var(--sidebar-w);
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar-header { padding: 25px 20px; background: #1e293b; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #334155; }
        .rxn-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .rxn-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            transition: 0.2s;
            font-size: 0.95rem;
            color: #94a3b8;
        }
        .rxn-item:hover { background: #1e293b; color: white; }
        .rxn-item.active { background: var(--primary); color: white; border-left: 4px solid #fff; }

        /* --- Right Main Pane --- */
        #main {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Equation UI */
        .eq-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
        }
        .coeff-box {
            width: 55px;
            font-size: 1.5rem;
            text-align: center;
            border: 3px solid var(--primary);
            border-radius: 8px;
            padding: 5px;
            background: #eff6ff;
        }

        /* Description / Definition */
        .details-box h2 { margin-top: 0; color: var(--primary); }
        .details-box ul { padding-left: 20px; line-height: 1.6; }
        .details-box li { margin-bottom: 8px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; }
        th { background: #f1f5f9; font-size: 0.8rem; letter-spacing: 1px; }
        .balanced { background: #dcfce7; color: #166534; font-weight: bold; }
        .unbalanced { background: #fee2e2; color: #991b1b; font-weight: bold; }

        /* Canvas */
        canvas {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            width: 100%;
            height: 300px;
        }

        .solve-btn {
            background: #1e293b; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .solve-btn:hover { background: var(--primary); }
        #main {
    overflow-x: auto; /* Adds horizontal scrollbar if equation is too wide */
}
canvas {
    min-width: 1200px; /* Forces the canvas to be wide enough for big equations */
}
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">Chemical Reactions</div>
        <ul class="rxn-list" id="rxnList"></ul>
    </div>

    <div id="main">
        <div class="section details-box">
            <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                    <h2 id="rxnTitle">Select a Reaction</h2>
                    <p id="rxnDef" style="font-style: italic; color: #475569;"></p>
                </div>
                <button class="solve-btn" onclick="autoSolve()">Auto-Balance</button>
            </div>
            <ul id="rxnBullets"></ul>
        </div>

        <div class="section">
            <div class="eq-display" id="eqContainer"></div>
        </div>

        <div class="section">
            <h3 style="margin-top:0">Atom Inventory Table</h3>
            <table>
                <thead>
                    <tr>
                        <th>Element</th>
                        <th>Reactants (LHS)</th>
                        <th>Status</th>
                        <th>Products (RHS)</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>

        <div class="section">
            <h3 style="margin-top:0">Molecular Visualization</h3>
            <canvas id="chemCanvas"></canvas>
        </div>
    </div>

<script>
const reactions = [
    {
        "title": "Burning of Magnesium Ribbon in Air",
        "type": "Combination Reaction, Redox Reaction",
        "definition": "A reaction in which a single product is formed from two or more reactants.",
        "bullets": [
            "Magnesium (a metal) reacts with Oxygen (a non-metal) from the air.",
            "It burns with a dazzling white flame.",
            "A white powder of Magnesium Oxide is formed.",
            "Magnesium is oxidized (gains oxygen) and Oxygen is reduced."
        ],
        "parts": [
            { "formula": "Mg", "atoms": {"Mg": 1}, "side": "lhs", "name": "Magnesium" },
            { "formula": "O₂", "atoms": {"O": 2}, "side": "lhs", "name": "Oxygen" },
            { "formula": "MgO", "atoms": {"Mg": 1, "O": 1}, "side": "rhs", "name": "Magnesium Oxide" }
        ],
        "solution": [2, 1, 2]
    },
    {
        "title": "Reaction of Zinc with Dilute Sulphuric Acid",
        "type": "Displacement Reaction",
        "definition": "A reaction in which a more reactive element displaces a less reactive element from its compound.",
        "bullets": [
            "Zinc is more reactive than Hydrogen.",
            "Bubbles of a colorless and odorless gas are evolved.",
            "The gas (Hydrogen) burns with a 'pop' sound when a burning splint is brought near it.",
            "The reaction is exothermic (the flask gets warm)."
        ],
        "parts": [
            { "formula": "Zn", "atoms": {"Zn": 1}, "side": "lhs", "name": "Zinc" },
            { "formula": "H₂SO₄", "atoms": {"H": 2, "S": 1, "O": 4}, "side": "lhs", "name": "Sulphuric Acid" },
            { "formula": "ZnSO₄", "atoms": {"Zn": 1, "S": 1, "O": 4}, "side": "rhs", "name": "Zinc Sulphate" },
            { "formula": "H₂", "atoms": {"H": 2}, "side": "rhs", "name": "Hydrogen Gas" }
        ],
        "solution": [1, 1, 1, 1]
    },
    {
        "title": "Reaction of Lead Nitrate and Potassium Iodide",
        "type": "Double Displacement Reaction, Precipitation Reaction",
        "definition": "A reaction in which there is an exchange of ions between two reacting compounds, often forming an insoluble solid.",
        "bullets": [
            "Both reactant solutions are colorless.",
            "A yellow insoluble solid (precipitate) of Lead Iodide is formed instantly.",
            "The ions Pb²⁺ and K⁺ exchange places with I⁻ and NO₃⁻."
        ],
        "parts": [
            { "formula": "Pb(NO₃)₂", "atoms": {"Pb": 1, "N": 2, "O": 6}, "side": "lhs", "name": "Lead(II) Nitrate" },
            { "formula": "KI", "atoms": {"K": 1, "I": 1}, "side": "lhs", "name": "Potassium Iodide" },
            { "formula": "PbI₂", "atoms": {"Pb": 1, "I": 2}, "side": "rhs", "name": "Lead(II) Iodide" },
            { "formula": "KNO₃", "atoms": {"K": 1, "N": 1, "O": 3}, "side": "rhs", "name": "Potassium Nitrate" }
        ],
        "solution": [1, 2, 1, 2]
    },
    {
        "title": "Reaction of Quicklime with Water",
        "type": "Combination Reaction, Exothermic Reaction",
        "definition": "A reaction in which a single product is formed from two or more reactants.",
        "bullets": [
            "Calcium Oxide (Quicklime) is a white solid.",
            "It reacts vigorously with water, producing a hissing sound.",
            "A large amount of heat is released, making the container hot.",
            "The product, Calcium Hydroxide (Slaked Lime), is a suspension that settles to form a solution (limewater)."
        ],
        "parts": [
            { "formula": "CaO", "atoms": {"Ca": 1, "O": 1}, "side": "lhs", "name": "Calcium Oxide" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "lhs", "name": "Water" },
            { "formula": "Ca(OH)₂", "atoms": {"Ca": 1, "O": 2, "H": 2}, "side": "rhs", "name": "Calcium Hydroxide" }
        ],
        "solution": [1, 1, 1]
    },
    {
        "title": "Thermal Decomposition of Ferrous Sulphate",
        "type": "Thermal Decomposition",
        "definition": "A reaction in which a single reactant breaks down into simpler products when heated.",
        "bullets": [
            "Hydrated Ferrous Sulphate (FeSO₄·7H₂O) is initially light green. On heating, it first loses water.",
            "Anhydrous Ferrous Sulphate (FeSO₄) is white.",
            "On further heating, it decomposes to form a reddish-brown solid (Ferric Oxide).",
            "Gases with the characteristic smell of burning sulphur (SO₂ and SO₃) are evolved."
        ],
        "parts": [
            { "formula": "FeSO₄", "atoms": {"Fe": 1, "S": 1, "O": 4}, "side": "lhs", "name": "Ferrous Sulphate" },
            { "formula": "Fe₂O₃", "atoms": {"Fe": 2, "O": 3}, "side": "rhs", "name": "Ferric Oxide" },
            { "formula": "SO₂", "atoms": {"S": 1, "O": 2}, "side": "rhs", "name": "Sulphur Dioxide" },
            { "formula": "SO₃", "atoms": {"S": 1, "O": 3}, "side": "rhs", "name": "Sulphur Trioxide" }
        ],
        "solution": [2, 1, 1, 1]
    },
    {
        "title": "Thermal Decomposition of Calcium Carbonate",
        "type": "Thermal Decomposition, Endothermic Reaction",
        "definition": "A reaction in which a single reactant breaks down into simpler products when heated.",
        "bullets": [
            "Calcium Carbonate (Limestone) is a white solid.",
            "On strong heating, it decomposes to form Calcium Oxide (Quicklime) and Carbon Dioxide gas.",
            "This reaction is a key step in the manufacturing of cement."
        ],
        "parts": [
            { "formula": "CaCO₃", "atoms": {"Ca": 1, "C": 1, "O": 3}, "side": "lhs", "name": "Calcium Carbonate" },
            { "formula": "CaO", "atoms": {"Ca": 1, "O": 1}, "side": "rhs", "name": "Calcium Oxide" },
            { "formula": "CO₂", "atoms": {"C": 1, "O": 2}, "side": "rhs", "name": "Carbon Dioxide" }
        ],
        "solution": [1, 1, 1]
    },
    {
        "title": "Thermal Decomposition of Lead Nitrate",
        "type": "Thermal Decomposition",
        "definition": "A reaction in which a single reactant breaks down into simpler products when heated.",
        "bullets": [
            "Lead Nitrate is a white crystalline solid.",
            "On heating, it produces a crackling sound.",
            "It decomposes to form a yellow solid residue (Lead Oxide).",
            "Brown fumes of Nitrogen Dioxide (NO₂) gas are evolved, along with colorless Oxygen (O₂) gas."
        ],
        "parts": [
            { "formula": "Pb(NO₃)₂", "atoms": {"Pb": 1, "N": 2, "O": 6}, "side": "lhs", "name": "Lead(II) Nitrate" },
            { "formula": "PbO", "atoms": {"Pb": 1, "O": 1}, "side": "rhs", "name": "Lead(II) Oxide" },
            { "formula": "NO₂", "atoms": {"N": 1, "O": 2}, "side": "rhs", "name": "Nitrogen Dioxide" },
            { "formula": "O₂", "atoms": {"O": 2}, "side": "rhs", "name": "Oxygen" }
        ],
        "solution": [2, 2, 4, 1]
    },
    {
        "title": "Electrolysis of Water",
        "type": "Electrolytic Decomposition",
        "definition": "A reaction where a compound is decomposed by passing an electric current through it.",
        "bullets": [
            "Pure water is a poor conductor; a few drops of acid are added to make it conduct electricity.",
            "Hydrogen gas is collected at the cathode (negative electrode).",
            "Oxygen gas is collected at the anode (positive electrode).",
            "The volume of Hydrogen gas produced is double the volume of Oxygen gas."
        ],
        "parts": [
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "lhs", "name": "Water" },
            { "formula": "H₂", "atoms": {"H": 2}, "side": "rhs", "name": "Hydrogen Gas" },
            { "formula": "O₂", "atoms": {"O": 2}, "side": "rhs", "name": "Oxygen Gas" }
        ],
        "solution": [2, 2, 1]
    },
    {
        "title": "Displacement of Copper by Iron",
        "type": "Displacement Reaction",
        "definition": "A reaction in which a more reactive element displaces a less reactive element from its compound.",
        "bullets": [
            "An iron nail is placed in a blue solution of Copper Sulphate.",
            "The blue color of the solution fades and turns light green.",
            "A reddish-brown coating of Copper metal is deposited on the iron nail.",
            "Iron is more reactive than Copper."
        ],
        "parts": [
            { "formula": "Fe", "atoms": {"Fe": 1}, "side": "lhs", "name": "Iron" },
            { "formula": "CuSO₄", "atoms": {"Cu": 1, "S": 1, "O": 4}, "side": "lhs", "name": "Copper(II) Sulphate" },
            { "formula": "FeSO₄", "atoms": {"Fe": 1, "S": 1, "O": 4}, "side": "rhs", "name": "Iron(II) Sulphate" },
            { "formula": "Cu", "atoms": {"Cu": 1}, "side": "rhs", "name": "Copper" }
        ],
        "solution": [1, 1, 1, 1]
    },
    {
        "title": "Respiration",
        "type": "Redox Reaction, Exothermic Reaction, Combustion",
        "definition": "A process in living organisms involving the production of energy, typically with the intake of oxygen and the release of carbon dioxide.",
        "bullets": [
            "Glucose (from food) combines with Oxygen (from breathing).",
            "Energy is released, which is used for various life processes.",
            "Carbon Dioxide and Water are the waste products.",
            "This reaction takes place inside the mitochondria of cells."
        ],
        "parts": [
            { "formula": "C₆H₁₂O₆", "atoms": {"C": 6, "H": 12, "O": 6}, "side": "lhs", "name": "Glucose" },
            { "formula": "O₂", "atoms": {"O": 2}, "side": "lhs", "name": "Oxygen" },
            { "formula": "CO₂", "atoms": {"C": 1, "O": 2}, "side": "rhs", "name": "Carbon Dioxide" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "rhs", "name": "Water" }
        ],
        "solution": [1, 6, 6, 6]
    },
    {
        "title": "Acid-Base Neutralization",
        "type": "Neutralization, Double Displacement",
        "definition": "A reaction between an acid and a base to form salt and water.",
        "bullets": [
            "An acid (like HCl) reacts with a base (like NaOH).",
            "The acidic and basic properties are destroyed (neutralized).",
            "A neutral salt (Sodium Chloride) and Water are formed.",
            "The reaction is generally exothermic."
        ],
        "parts": [
            { "formula": "HCl", "atoms": {"H": 1, "Cl": 1}, "side": "lhs", "name": "Hydrochloric Acid" },
            { "formula": "NaOH", "atoms": {"Na": 1, "O": 1, "H": 1}, "side": "lhs", "name": "Sodium Hydroxide" },
            { "formula": "NaCl", "atoms": {"Na": 1, "Cl": 1}, "side": "rhs", "name": "Sodium Chloride" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "rhs", "name": "Water" }
        ],
        "solution": [1, 1, 1, 1]
    },
    {
        "title": "Reaction of Acid with a Metal Carbonate",
        "type": "Gas Evolution Reaction",
        "definition": "A reaction that produces a gas as one of its products.",
        "bullets": [
            "Acids react with metal carbonates to produce a salt, water, and carbon dioxide.",
            "Brisk effervescence (fizzing) is observed due to the evolution of CO₂ gas.",
            "The CO₂ gas turns limewater (Ca(OH)₂) milky."
        ],
        "parts": [
            { "formula": "Na₂CO₃", "atoms": {"Na": 2, "C": 1, "O": 3}, "side": "lhs", "name": "Sodium Carbonate" },
            { "formula": "HCl", "atoms": {"H": 1, "Cl": 1}, "side": "lhs", "name": "Hydrochloric Acid" },
            { "formula": "NaCl", "atoms": {"Na": 1, "Cl": 1}, "side": "rhs", "name": "Sodium Chloride" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "rhs", "name": "Water" },
            { "formula": "CO₂", "atoms": {"C": 1, "O": 2}, "side": "rhs", "name": "Carbon Dioxide" }
        ],
        "solution": [1, 2, 2, 1, 1]
    },
    {
        "title": "The Chlor-alkali Process",
        "type": "Electrolytic Decomposition",
        "definition": "A reaction where a compound is decomposed by passing an electric current through it.",
        "bullets": [
            "An electric current is passed through an aqueous solution of NaCl (brine).",
            "It decomposes to form Sodium Hydroxide (an alkali).",
            "Chlorine gas is formed at the anode.",
            "Hydrogen gas is formed at the cathode."
        ],
        "parts": [
            { "formula": "NaCl", "atoms": {"Na": 1, "Cl": 1}, "side": "lhs", "name": "Sodium Chloride" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "lhs", "name": "Water" },
            { "formula": "NaOH", "atoms": {"Na": 1, "O": 1, "H": 1}, "side": "rhs", "name": "Sodium Hydroxide" },
            { "formula": "Cl₂", "atoms": {"Cl": 2}, "side": "rhs", "name": "Chlorine Gas" },
            { "formula": "H₂", "atoms": {"H": 2}, "side": "rhs", "name": "Hydrogen Gas" }
        ],
        "solution": [2, 2, 2, 1, 1]
    },
    {
        "title": "Preparation of Plaster of Paris (POP)",
        "type": "Thermal Decomposition",
        "definition": "A reaction in which a single reactant breaks down into simpler products when heated.",
        "bullets": [
            "Gypsum (Calcium Sulphate Dihydrate) is heated carefully at 373 K (100°C).",
            "It loses one and a half molecules of water of crystallization.",
            "The product is Plaster of Paris (Calcium Sulphate Hemihydrate).",
            "If heated above 373 K, all water is lost, and 'dead burnt plaster' is formed."
        ],
        "parts": [
            { "formula": "CaSO₄·2H₂O", "atoms": {"Ca": 1, "S": 1, "O": 6, "H": 4}, "side": "lhs", "name": "Gypsum" },
            { "formula": "CaSO₄·½H₂O", "atoms": {"Ca": 1, "S": 1, "O": 4.5, "H": 1}, "side": "rhs", "name": "Plaster of Paris" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "rhs", "name": "Water" }
        ],
        "solution": [1, 1, 1.5]
    },
    {
        "title": "Reaction of Iron with Steam",
        "type": "Displacement Reaction, Redox Reaction",
        "definition": "A reaction in which a more reactive element displaces a less reactive element from its compound.",
        "bullets": [
            "Iron does not react with cold or hot water.",
            "It reacts with steam to form Iron (II, III) Oxide (also called magnetite).",
            "Hydrogen gas is also produced.",
            "The reaction is reversible."
        ],
        "parts": [
            { "formula": "Fe", "atoms": {"Fe": 1}, "side": "lhs", "name": "Iron" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "lhs", "name": "Water (Steam)" },
            { "formula": "Fe₃O₄", "atoms": {"Fe": 3, "O": 4}, "side": "rhs", "name": "Iron(II,III) Oxide" },
            { "formula": "H₂", "atoms": {"H": 2}, "side": "rhs", "name": "Hydrogen Gas" }
        ],
        "solution": [3, 4, 1, 4]
    },
    {
        "title": "The Thermite Reaction",
        "type": "Displacement Reaction, Redox Reaction, Exothermic Reaction",
        "definition": "A reaction in which a more reactive element displaces a less reactive element from its compound.",
        "bullets": [
            "Aluminium is more reactive than Iron.",
            "Aluminium powder displaces Iron from Iron(III) Oxide.",
            "The reaction is highly exothermic, producing molten Iron.",
            "This reaction is used to join railway tracks or cracked machine parts."
        ],
        "parts": [
            { "formula": "Fe₂O₃", "atoms": {"Fe": 2, "O": 3}, "side": "lhs", "name": "Iron(III) Oxide" },
            { "formula": "Al", "atoms": {"Al": 1}, "side": "lhs", "name": "Aluminium" },
            { "formula": "Al₂O₃", "atoms": {"Al": 2, "O": 3}, "side": "rhs", "name": "Aluminium Oxide" },

        "solution": [1, 2, 1, 2]
    },
    {
        "title": "Combustion of Methane",
        "type": "Combustion, Redox Reaction, Exothermic Reaction",
        "definition": "A rapid reaction between a substance with an oxidant, usually oxygen, to produce heat and light.",
        "bullets": [
            "Methane (natural gas) is a saturated hydrocarbon.",
            "It burns in oxygen with a clean, blue flame.",
            "The products are Carbon Dioxide and Water.",
            "A large amount of heat and light is produced."
        ],
        "parts": [
            { "formula": "CH₄", "atoms": {"C": 1, "H": 4}, "side": "lhs", "name": "Methane" },
            { "formula": "O₂", "atoms": {"O": 2}, "side": "lhs", "name": "Oxygen" },
            { "formula": "CO₂", "atoms": {"C": 1, "O": 2}, "side": "rhs", "name": "Carbon Dioxide" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "rhs", "name": "Water" }
        ],
        "solution": [1, 2, 1, 2]
    },
    {
        "title": "Hydrogenation of Ethene",
        "type": "Addition Reaction",
        "definition": "A reaction in which atoms are added across a double or triple bond in an unsaturated compound.",
        "bullets": [
            "Ethene is an unsaturated hydrocarbon (contains a C=C double bond).",
            "Hydrogen is added across the double bond in the presence of a catalyst like Nickel or Palladium.",
            "The product is Ethane, a saturated hydrocarbon (contains only C-C single bonds).",
            "This process is used to convert unsaturated vegetable oils into saturated fats (vanaspati ghee)."
        ],
        "parts": [
            { "formula": "CH₂=CH₂", "atoms": {"C": 2, "H": 4}, "side": "lhs", "name": "Ethene" },
            { "formula": "H₂", "atoms": {"H": 2}, "side": "lhs", "name": "Hydrogen" },
            { "formula": "CH₃-CH₃", "atoms": {"C": 2, "H": 6}, "side": "rhs", "name": "Ethane" }
        ],
        "solution": [1, 1, 1]
    },
    {
        "title": "Esterification Reaction",
        "type": "Esterification",
        "definition": "A reaction between a carboxylic acid and an alcohol to form an ester and water, typically in the presence of an acid catalyst.",
        "bullets": [
            "Ethanoic acid reacts with absolute ethanol.",
            "A few drops of concentrated sulphuric acid act as a catalyst and a dehydrating agent.",
            "A sweet-smelling substance called an ester (Ethyl ethanoate) is formed.",
            "The reaction is reversible."
        ],
        "parts": [
            { "formula": "CH₃COOH", "atoms": {"C": 2, "H": 4, "O": 2}, "side": "lhs", "name": "Ethanoic Acid" },
            { "formula": "C₂H₅OH", "atoms": {"C": 2, "H": 6, "O": 1}, "side": "lhs", "name": "Ethanol" },
            { "formula": "CH₃COOC₂H₅", "atoms": {"C": 4, "H": 8, "O": 2}, "side": "rhs", "name": "Ethyl Ethanoate (Ester)" },
            { "formula": "H₂O", "atoms": {"H": 2, "O": 1}, "side": "rhs", "name": "Water" }
        ],
        "solution": [1, 1, 1, 1]
    },
    {

    let activeRxn = reactions[0];
    const canvas = document.getElementById('chemCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
        const list = document.getElementById('rxnList');
        reactions.forEach((r, i) => {
            const li = document.createElement('li');
            li.className = 'rxn-item';
            li.innerText = r.title;
            li.onclick = () => selectRxn(i);
            list.appendChild(li);
        });
        selectRxn(0);
    }

    function selectRxn(idx) {
        activeRxn = reactions[idx];
        document.getElementById('rxnTitle').innerText = activeRxn.title + " (" + activeRxn.type + ")";
        document.getElementById('rxnDef').innerText = "Definition: " + activeRxn.definition;
        
        const bullets = document.getElementById('rxnBullets');
        bullets.innerHTML = '';
        activeRxn.bullets.forEach(b => {
            const li = document.createElement('li');
            li.innerText = b;
            bullets.appendChild(li);
        });

        document.querySelectorAll('.rxn-item').forEach((el, i) => {
            el.className = i === idx ? 'rxn-item active' : 'rxn-item';
        });

        renderEq();
    }

    function renderEq() {
        const container = document.getElementById('eqContainer');
        container.innerHTML = '';
        const lhs = activeRxn.parts.filter(p => p.side === 'lhs');
        const rhs = activeRxn.parts.filter(p => p.side === 'rhs');

        const addMolecule = (mol) => {
            const div = document.createElement('div');
            div.innerHTML = `<input type="number" class="coeff-box" value="1" min="1" oninput="calculate()"> 
                             <span>${mol.formula.replace(/(\d+)/g, '<sub>$1</sub>')}</span>`;
            container.appendChild(div);
        };

        lhs.forEach((m, i) => {
            addMolecule(m);
            if (i < lhs.length - 1) container.innerHTML += '<span>+</span>';
        });
        container.innerHTML += '<span>&rarr;</span>';
        rhs.forEach((m, i) => {
            addMolecule(m);
            if (i < rhs.length - 1) container.innerHTML += '<span>+</span>';
        });

        calculate();
    }

    function calculate() {
        const inputs = document.querySelectorAll('.coeff-box');
        const elSet = new Set();
        activeRxn.parts.forEach(p => Object.keys(p.atoms).forEach(a => elSet.add(a)));

        const results = { lhs: {}, rhs: {} };
        elSet.forEach(e => { results.lhs[e] = { total: 0, steps: [] }; results.rhs[e] = { total: 0, steps: [] }; });

        inputs.forEach((input, i) => {
            const val = parseInt(input.value) || 0;
            const part = activeRxn.parts[i];
            for (let el in part.atoms) {
                const sub = part.atoms[el];
                results[part.side][el].total += (val * sub);
                results[part.side][el].steps.push(`${val} × ${sub}`);
            }
        });

        const tbody = document.getElementById('inventoryTable');
        tbody.innerHTML = '';
        elSet.forEach(el => {
            const l = results.lhs[el];
            const r = results.rhs[el];
            const isMatch = l.total === r.total;
            tbody.innerHTML += `
                <tr class="${isMatch ? 'balanced' : 'unbalanced'}">
                    <td><strong>${el}</strong></td>
                    <td>${l.steps.join(' + ')} = ${l.total}</td>
                    <td>${isMatch ? '✔ Balanced' : '✖ Unbalanced'}</td>
                    <td>${r.steps.join(' + ')} = ${r.total}</td>
                </tr>`;
        });

        drawDiagram(inputs);
    }
function drawDiagram(inputs) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const colors = { H: '#e2e8f0', O: '#ef4444', C: '#1e293b', Fe: '#94a3b8', Na: '#a855f7', S: '#fbbf24', Cl: '#4ade80' };
    
    let xPos = 40; // Starting point
    const atomRadius = 15;
    const atomPadding = 10; // Space between atoms in a molecule

    inputs.forEach((input, i) => {
        const coeff = parseInt(input.value) || 0;
        const part = activeRxn.parts[i];
        
        // --- 1. Calculate how wide this specific molecule is ---
        const totalAtomsInOneMol = Object.values(part.atoms).reduce((a, b) => a + b, 0);
        // Width = (number of atoms * diameter) + padding
        const molWidth = (totalAtomsInOneMol * (atomRadius * 2)) - 10; 
        
        // --- 2. Draw the molecules (stacking them slightly) ---
        // We limit visual drawing to 4 molecules so it doesn't fill the whole screen
        const visualCoeff = Math.min(coeff, 4); 
        
        for (let c = 0; c < visualCoeff; c++) {
            // Stack molecules slightly downwards and to the right
            let molX = xPos + (c * 12); 
            let molY = 80 + (c * 45); 

            let atomXOffset = 0;
            Object.keys(part.atoms).forEach(el => {
                for(let n=0; n < part.atoms[el]; n++) {
                    const centerX = molX + atomXOffset;
                    const centerY = molY;
                    
                    // 3D Sphere Effect
                    const grad = ctx.createRadialGradient(centerX-5, centerY-5, 2, centerX, centerY, atomRadius);
                    grad.addColorStop(0, '#fff');
                    grad.addColorStop(1, colors[el] || '#000');
                    
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, atomRadius, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    // Atom Label
                    ctx.fillStyle = (el === 'C' || el === 'Fe') ? '#fff' : '#000';
                    ctx.font = "bold 11px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(el, centerX, centerY + 4);
                    
                    atomXOffset += (atomRadius * 2) + 2; // Move right for next atom in molecule
                }
            });
        }

        // --- 3. Position the Symbol (+ or →) ---
        let nextPart = activeRxn.parts[i+1];
        if (nextPart) {
            const isCrossingSide = (part.side !== nextPart.side);
            const symbol = isCrossingSide ? "→" : "+";
            
            // The gap depends on the width of the molecule we just drew
            // We add extra space (80 or 150) so the symbol has room
            const gapToNext = isCrossingSide ? 180 : 110; 
            
            ctx.fillStyle = "#1e293b";
            ctx.font = "bold 30px Arial";
            ctx.textAlign = "center";
            
            // Place symbol between current xPos end and next xPos start
            const symbolX = xPos + molWidth + (gapToNext / 2);
            ctx.fillText(symbol, symbolX, 140);
            
            // Move xPos forward for the next molecule species
            xPos += molWidth + gapToNext;
        }
    });
}
    function autoSolve() {
        const inputs = document.querySelectorAll('.coeff-box');
        activeRxn.solution.forEach((v, i) => inputs[i].value = v);
        calculate();
    }

    window.onload = () => {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        init();
    };
